name: Build APK & unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prebuild Android project
        run: CI=1 npx expo prebuild --platform android --no-install

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zelda-helper-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 7

  ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Patch expo-modules-jsi (Swift 6.2 data race fix)
        run: |
          python3 - <<'PYEOF'
          path = 'node_modules/expo-modules-jsi/apple/Sources/ExpoModulesJSI/Runtime/Values/JavaScriptObject.swift'
          s = open(path, encoding='utf-8').read()
          rep = [
            ('nonisolated(unsafe) let slot = buffer.baseAddress!', 'let slot = UncheckedSendable(buffer.baseAddress!)'),
            ('expo.emplaceUndefined(slot)', 'expo.emplaceUndefined(slot.value)'),
            ('expo.destroyValues(slot, 1)', 'expo.destroyValues(slot.value, 1)'),
            ('encode(JavaScriptValue.Slot(slot), runtime)', 'encode(JavaScriptValue.Slot(slot.value), runtime)'),
            ('body(slot.pointee)', 'body(slot.value.pointee)'),
          ]
          for old, new in rep:
              assert s.count(old) == 1, f'not unique: {old}'
              s = s.replace(old, new)
          open(path, 'w', encoding='utf-8').write(s)
          print('patched expo-modules-jsi')
          PYEOF

      - name: Prebuild iOS project
        run: CI=1 npx expo prebuild --platform ios --no-install

      - name: Select Xcode 26.2
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version

      - name: Install CocoaPods
        run: cd ios && pod install

      - name: Build unsigned app
        run: |
          cd ios
          xcodebuild             -workspace ZeldaHelper.xcworkspace             -scheme ZeldaHelper             -configuration Release             -sdk iphoneos             -derivedDataPath build             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""             CODE_SIGNING_IDENTITY=""

      - name: Package IPA
        run: |
          APP=$(find ios/build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "App bundle: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry zelda-helper-unsigned.ipa Payload
          ls -lh zelda-helper-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: zelda-helper-ipa
          path: zelda-helper-unsigned.ipa
          retention-days: 7
